name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release new version"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js and tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Smoke test
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js and tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - name: Build production bundle
        run: npm run compile -- --production

      - name: Package VSIX
        run: npm run package

      - name: Commit version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add package.json package-lock.json task.json vss-extension.json
          git commit -m "chore: release v${VERSION}"

      - name: Publish to Visual Studio Marketplace
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          set -euo pipefail
          VSIX="$(ls *.vsix | head -n1)"
          echo "Publishing ${VSIX}"
          npx tfx extension publish \
            --vsix "${VSIX}" \
            --auth-type pat \
            --token "${VS_MARKETPLACE_PAT}"

      - name: Push commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          vsixes=(*.vsix)
          if [ ${#vsixes[@]} -eq 0 ]; then
            echo "No VSIXes found" >&2
            exit 1
          fi
          gh release create "v${VERSION}" "${vsixes[@]}" \
            --draft \
            --generate-notes \
            --title "v${VERSION}"
