name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js and tools
        uses: jdx/mise-action@v4.2.3

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run compile -- --production

      - name: Publish to Visual Studio Marketplace
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: npm run publish -- --auth-type pat --token "${VS_MARKETPLACE_PAT}" --no-prompt

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: ggshield-ado-vsix

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          vsixes=(*.vsix)
          if [ ${#vsixes[@]} -eq 0 ]; then
            echo "No VSIXes found" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${vsixes[@]}" \
            --draft \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
