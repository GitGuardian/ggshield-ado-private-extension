name: vsixbuilder

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_call:

permissions:
  contents: read

jobs:
  build_vsix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js and tools
        uses: jdx/mise-action@v4.2.3

      - name: Install dependencies
        run: npm ci

      - name: Build extension bundle
        run: npm run compile -- --production

      - name: Package extension VSIX
        run: npm run package

      - name: Upload extension package
        uses: actions/upload-artifact@v7
        with:
          name: ggshield-ado-vsix
          path: "*.vsix"
