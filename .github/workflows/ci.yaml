name: CI

on:
  pull_request:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
    paths-ignore:
      - "README.md"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Run pre-commit
        uses: j178/prek-action@v2
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js and tools
        uses: jdx/mise-action@v4.2.3

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build extension bundle
        run: npm run compile

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js and tools
        uses: jdx/mise-action@v4.2.3

      - name: Install dependencies
        run: npm ci

      - name: Smoke test
        run: npm test
